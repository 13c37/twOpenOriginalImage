name: tests

on:
  push:
    paths: ['twOpenOriginalImage.user.js', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check twOpenOriginalImage.user.js
      - run: python tests/suite.py
